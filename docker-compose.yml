version: "3.9"

services:
  api:
    build: ./project_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appuser:supersecret@db:5432/appdb
    volumes:
      - uploads_data:/app/uploads     # uploaded files survive container restarts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./learn_react
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./project_backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
  uploads_data: